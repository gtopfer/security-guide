name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f "Security-Guide/osint-tools-collection/scripts/requirements.txt" ]; then pip install -r "Security-Guide/osint-tools-collection/scripts/requirements.txt"; fi
          if [ -f "Security-Guide/threat-intel-tools-collection/scripts/requirements.txt" ]; then pip install -r "Security-Guide/threat-intel-tools-collection/scripts/requirements.txt"; fi
          pip install pre-commit pytest

      - name: Run pre-commit
        run: |
          pre-commit run --all-files || true

      - name: Run tests
        run: |
          pytest -q || true
