[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "osint-tools-collection"
version = "0.1.0"
description = "Coleção OSINT do repositório Security-Guide"
readme = "README.md"
requires-python = ">=3.10"
authors = [ { name = "gtopfer" } ]

[project.scripts]
osint-collector = "osint_tools_collection.cli:main"

[tool.setuptools]
packages = { find = {} }
